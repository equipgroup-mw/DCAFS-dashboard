<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DCAFS Map — Mobile</title>
  <meta name="theme-color" content="#0d2136">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy:     #0d2136; /* Navy */
      --purple:   #a8935a; /* Gold */
      --teal:     #0d2136; 
      --grey:     #d3d6d9;
      --mobile-padding: 14px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%; margin: 0; padding: 0;
      background: #eceef2;
      font-family: 'DM Sans', 'Segoe UI', Roboto, Arial, sans-serif;
      overflow: hidden; color: #111;
      touch-action: manipulation;
    }

    .header {
      position: absolute; top: 16px; left: var(--mobile-padding); right: var(--mobile-padding);
      z-index: 75; pointer-events: none; text-align: center;
    }
    .header.hidden { opacity: 0; visibility: hidden; }
    .header-card {
      margin: 0 auto; padding: 10px 16px; background: rgba(255,255,255,0.92);
      border-radius: 10px; box-shadow: 0 2px 12px rgba(13,33,54,0.10);
      border-left: 4px solid var(--purple);
      display: inline-flex; align-items: center; gap: 10px; max-width: 100%; pointer-events: auto;
    }
    .header-text { text-align: left; line-height: 1.2; }
    .header-text h1 { margin: 0; font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--navy); font-weight: 700; }
    .header-text p { margin: 1px 0 0; font-size: 10px; color: #666; font-weight: 500; }

    .back-btn { position: absolute; top: 16px; left: var(--mobile-padding); z-index: 90; background: var(--navy); color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-weight: 700; font-size: 12px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    
    #map-root { position: absolute; width: 100vw; height: 100vh; left: 0; top: 0; overflow: hidden; background: #eceef2; }
    svg { width: 100%; height: 100%; display: block; overflow: hidden; }

    .district { stroke: #333; stroke-width: 2px; cursor: pointer; paint-order: stroke; pointer-events: none; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; shape-rendering: crispEdges; outline: none !important; }
    .district-click-target { fill: transparent !important; stroke: transparent !important; pointer-events: all !important; cursor: pointer !important; outline: none !important; -webkit-tap-highlight-color: transparent !important; vector-effect: non-scaling-stroke; stroke-width: 6px !important; }
    .district-click-likoma { stroke-width: 20px !important; }
    .lake { fill: #b8d9ef; stroke: #8eb8d6; stroke-width: 0.4px; vector-effect: non-scaling-stroke; }
    .faded { opacity: 0.12; }
    .focused { stroke-width: 3px; stroke: var(--navy); filter: drop-shadow(0 4px 8px rgba(168,147,90,0.45)); }

    .district-label { font-size: 9px; font-weight: 600; fill: #262626; text-anchor: middle; pointer-events: none; user-select: none; paint-order: stroke; stroke: white; stroke-width: 2px; stroke-opacity: 0.8; will-change: transform; }
    .district-label.hidden { display: none; }

    .control-buttons { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); z-index: 70; display: flex; flex-direction: column; gap: 12px; }
    .control-button-wrapper { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .button-label { font-size: 8px; color: #444; text-align: center; font-weight: 500; }
    .control-button { width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.92); border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: all 0.2s ease; }
    .control-button:active { transform: scale(0.92); background: var(--navy); color: white; }

    .info-panel, .stats-panel {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 0; background: #ffffff;
      border-top: 1px solid rgba(0,0,0,0.08); border-radius: 16px 16px 0 0; z-index: 90;
      overflow: hidden; padding: 0; transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .info-panel.visible, .stats-panel.visible { height: 50vh; transform: translateY(0); }
    
    .panel-header { position: sticky; top: 0; background: white; z-index: 10; padding: 14px 14px 8px; border-bottom: 1px solid #eee; }
    .panel-content { height: calc(100% - 60px); overflow-y: auto; padding: 0 14px 14px; -webkit-overflow-scrolling: touch; }
    .panel-title { color: var(--navy); font-weight: 700; margin-bottom: 4px; font-size: 22px; font-family: 'DM Serif Display', serif; }
    .panel-subtitle { color: #666; font-size: 14px; font-weight: 500; }

    .impact-stat-row { padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
    .impact-stat-row:last-child { border-bottom: none; }
    .impact-stat-label { font-size: 10px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 2px; }
    .impact-stat-value { font-size: 22px; font-weight: 700; color: var(--navy); line-height: 1; margin-bottom: 4px; word-wrap: break-word; }
    .impact-stat-sub { font-size: 12px; color: #666; margin-bottom: 4px; font-weight: 500; }
    .impact-stat-bar-track { height: 4px; background: #eee; border-radius: 2px; overflow: hidden; }
    .impact-stat-bar { height: 100%; border-radius: 2px; transition: width 600ms ease; }
    .bar-navy { background: var(--navy); }
    .bar-purple { background: var(--purple); }

    .totals-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
    .totals-row:last-child { border-bottom: none; }
    .totals-label { font-size: 13px; font-weight: 600; color: #444; display: flex; align-items: center; gap: 8px; }
    .totals-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .totals-value { font-size: 16px; font-weight: 700; color: var(--navy); }

    .search-container { padding: 10px 0; }
    #district-search { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; margin-bottom: 10px; font-family: inherit; }
    #district-search:focus { outline: none; border-color: var(--purple); box-shadow: 0 0 0 2px rgba(168,147,90,0.15); }
    .search-results { max-height: 250px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .search-result-item { padding: 14px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 16px; font-weight: 500; transition: all 0.2s ease; }
    .search-result-item:active { background-color: #f0f9f7; }

    #legend { position: absolute; bottom: 18px; right: var(--mobile-padding); background: rgba(255,255,255,0.9); border-radius: 8px; padding: 8px 12px; box-shadow: 0 2px 10px rgba(13,33,54,0.08); z-index: 65; font-size: 10px; transition: opacity 250ms ease, visibility 250ms ease; }
    #legend.hidden { opacity: 0; visibility: hidden; }
    .legend-title { font-weight: 700; color: var(--navy); margin-bottom: 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; color: #555; font-weight: 500; }
    .legend-item:last-child { margin-bottom: 0; }
    .legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

    .close-button { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.04); border: none; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; z-index: 100; touch-action: manipulation; transition: all 0.2s ease; color: #666; }
    .close-button:active { background: rgba(0,0,0,0.1); transform: scale(0.92); }

    #esc-hint { position: absolute; top: 14px; right: 50px; background: rgba(255,255,255,0.9); border-radius: 6px; padding: 6px 12px; font-size: 11px; color: #888; box-shadow: 0 2px 8px rgba(0,0,0,0.06); z-index: 70; opacity: 0; pointer-events: none; visibility: hidden; transition: opacity 250ms ease, visibility 250ms ease; }
    #esc-hint.visible { opacity: 1; visibility: visible; }

    .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 200; background: rgba(255,255,255,0.95); padding: 20px 28px; border-radius: 12px; box-shadow: 0 4px 16px rgba(13,33,54,0.12); display: flex; align-items: center; gap: 12px; font-weight: 600; color: var(--navy); font-size: 14px; }
    .loading-spinner { width: 22px; height: 22px; border: 3px solid rgba(13,33,54,0.1); border-radius: 50%; border-top-color: var(--purple); animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <button class="back-btn" onclick="window.location.href='index.html'">← Back</button>

  <div class="header" id="header">
    <div class="header-card">
      <div class="header-text">
        <h1>DCAFS Projects</h1>
        <p>Malawi District Coverage</p>
      </div>
    </div>
  </div>

  <div id="map-root" role="application" aria-label="Malawi impact map">
    <svg id="map-svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>

    <div class="control-buttons">
      <div class="control-button-wrapper">
        <button id="totals-button" class="control-button" aria-label="Show nationwide totals">📊</button>
        <span class="button-label">Totals</span>
      </div>
      <div class="control-button-wrapper">
        <button id="search-button" class="control-button" aria-label="Search districts">🔍</button>
        <span class="button-label">Search</span>
      </div>
      <div class="control-button-wrapper">
        <button id="reset-button" class="control-button" aria-label="Reset view">🏠</button>
        <span class="button-label">Reset</span>
      </div>
    </div>

    <div id="esc-hint">Tap map to deselect</div>

    <div id="legend">
      <div class="legend-title">Key</div>
      <div class="legend-item"><div class="legend-swatch" style="background:var(--purple)"></div>Active</div>
      <div class="legend-item"><div class="legend-swatch" style="background:var(--grey)"></div>No Data</div>
      <div class="legend-item"><div class="legend-swatch" style="background:var(--navy)"></div>Selected</div>
    </div>

    <div id="info-panel" class="info-panel" role="dialog" aria-hidden="true">
      <button class="close-button" aria-label="Close panel">×</button>
      <div class="panel-header">
        <div class="panel-title" id="info-panel-title">District</div>
        <div class="panel-subtitle" id="info-panel-subtitle">Project breakdown</div>
      </div>
      <div class="panel-content" id="info-panel-content"></div>
    </div>

    <div id="totals-panel" class="stats-panel">
      <button class="close-button" aria-label="Close panel">×</button>
      <div class="panel-header">
        <div class="panel-title">DCAFS Overview</div>
        <div class="panel-subtitle">Nationwide reach</div>
      </div>
      <div class="panel-content" id="totals-panel-content"></div>
    </div>

    <div id="search-panel" class="stats-panel">
      <button class="close-button" aria-label="Close panel">×</button>
      <div class="panel-header">
        <div class="panel-title">Search Districts</div>
        <div class="panel-subtitle">Find a district by name</div>
      </div>
      <div class="panel-content">
        <div class="search-container">
          <input type="text" id="district-search" placeholder="Type district name…" />
          <div id="search-results" class="search-results"></div>
        </div>
      </div>
    </div>

    <div id="loading" class="loading">
      <div class="loading-spinner"></div>
      <span>Loading data…</span>
    </div>
  </div>

  <script>
  (function(){
    const DISTRICT_LABELS = { "BALAKA": "BLK", "BLANTYRE": "BT", "CHIKWAWA": "CK", "CHIRADZULU": "CR", "CHITIPA": "CP", "DEDZA": "DZ", "DOWA": "DA", "KARONGA": "KA", "KASUNGU": "KU", "LIKOMA": "LK", "LILONGWE": "LL", "MACHINGA": "MA", "MANGOCHI": "MHG", "MCHINJI": "MC", "MULANJE": "MU", "MWANZA": "MW", "MZIMBA": "MZ", "NENO": "NN", "NKHATA BAY": "NB", "NKHOTAKOTA": "KK", "NSANJE": "NE", "NTCHEU": "NU", "NTCHISI": "NS", "PHALOMBE": "PE", "RUMPHI": "RU", "SALIMA": "SA", "THYOLO": "TO", "ZOMBA": "ZA" };

    // Hardcoded Data
    const DATA = [
      { district: "Lilongwe", projects: 15, names: "MFSRP, SVTP-II, FIN4Ag, SAPP II", budget: "$45.20M", chains: "Maize, Soybean, Rice" },
      { district: "Mzimba", projects: 12, names: "PRIDE, SAPP II, NASFAM", budget: "$32.10M", chains: "Potatoes, Maize, Chili" },
      { district: "Kasungu", projects: 11, names: "SAPP II, TRADE, YEFFA", budget: "$28.50M", chains: "Soybean, Groundnut, Maize" },
      { district: "Dowa", projects: 10, names: "FIN4Ag, FARMSE, TRADE", budget: "$18.40M", chains: "Soybean, Sunflower, Rice" },
      { district: "Blantyre", projects: 9, names: "GETF, RTC-MARKET, UCHI", budget: "$22.30M", chains: "Macadamia, Mango, Aquaculture" },
      { district: "Salima", projects: 8, names: "MWASIP, PRIDE, SVTP-II", budget: "$15.60M", chains: "Rice, Maize, Fish" },
      { district: "Mangochi", projects: 8, names: "MWASIP, TRADE, RTC-MARKET", budget: "$14.20M", chains: "Rice, Cotton, Cassava" },
      { district: "Dedza", projects: 7, names: "SAPP II, TRADE, MIERA III", budget: "$12.10M", chains: "Maize, Beans, Potato" },
      { district: "Rumphi", projects: 7, names: "PRIDE, NASFAM, SAPP II", budget: "$11.50M", chains: "Rice, Chili, Groundnut" },
      { district: "Mchinji", projects: 6, names: "TRADE, SAPP II, NASFAM", budget: "$9.80M", chains: "Soybean, Groundnut, Maize" },
      { district: "Nsanje", projects: 6, names: "SVTP-II, TSOLATA, WFP", budget: "$10.20M", chains: "Maize, Sorghum, Cowpeas" },
      { district: "Zomba", projects: 6, names: "MWASIP, BRACC, TRADE", budget: "$13.40M", chains: "Maize, Rice, Pigeon Pea" },
      { district: "Chikwawa", projects: 6, names: "SVTP-II, WFP, BRACC", budget: "$12.80M", chains: "Maize, Sugar, Cotton" },
      { district: "Machinga", projects: 5, names: "MWASIP, TRADE, WFP", budget: "$8.60M", chains: "Rice, Maize, Groundnut" },
      { district: "Thyolo", projects: 5, names: "MWASIP, UCHI, BRACC", budget: "$9.10M", chains: "Tea, Macadamia, Avocado" },
      { district: "Mulanje", projects: 5, names: "MWASIP, UCHI, TRADE", budget: "$8.90M", chains: "Tea, Macadamia, Citrus" },
      { district: "Phalombe", projects: 5, names: "PRIDE, TRADE, BRACC", budget: "$7.20M", chains: "Rice, Potato, Maize" },
      { district: "Chiradzulu", projects: 4, names: "PRIDE, UCHI, RTC-MARKET", budget: "$6.50M", chains: "Macadamia, Maize, Cassava" },
      { district: "Balaka", projects: 4, names: "TRADE, NASFAM, MIERA III", budget: "$5.80M", chains: "Soybean, Cotton, Sorghum" },
      { district: "Nkhotakota", projects: 4, names: "PRIDE, TRADE, YEFFA", budget: "$6.10M", chains: "Rice, Cassava, Fish" },
      { district: "Karonga", projects: 4, names: "PRIDE, NASFAM, TRANSFORM", budget: "$5.50M", chains: "Rice, Cassava, Beans" },
      { district: "Chitipa", projects: 3, names: "PRIDE, TRANSFORM, NASFAM", budget: "$4.20M", chains: "Rice, Beans, Groundnut" },
      { district: "Nkhata Bay", projects: 3, names: "PRIDE, TRANSFORM, NASFAM", budget: "$4.10M", chains: "Cassava, Fish, Rice" },
      { district: "Ntcheu", projects: 3, names: "TRADE, SAPP II, GETF", budget: "$4.80M", chains: "Soybean, Potato, Maize" },
      { district: "Mwanza", projects: 2, names: "MWASIP, BRACC", budget: "$2.50M", chains: "Maize, Sorghum, Groundnut" },
      { district: "Neno", projects: 2, names: "MWASIP, BRACC", budget: "$2.10M", chains: "Maize, Sorghum, Beans" },
      { district: "Likoma", projects: 1, names: "TRANSFORM", budget: "$0.50M", chains: "Fish, Cassava" }
    ];

    const mapRoot = document.getElementById('map-root');
    const svg = d3.select('#map-svg');
    let width = mapRoot.clientWidth, height = mapRoot.clientHeight;
    svg.attr('viewBox', `0 0 ${width} ${height}`);

    const mapGroup = svg.append('g').attr('id', 'mapGroup');
    const infoPanel = d3.select('#info-panel');
    const totalsPanel = d3.select('#totals-panel');
    const searchPanel = d3.select('#search-panel');
    const legend = d3.select('#legend');
    const escHint = d3.select('#esc-hint');
    const header = d3.select('#header');
    const loading = d3.select('#loading');
    const districtSearch = d3.select('#district-search');
    const searchResults = d3.select('#search-results');

    const projection = d3.geoMercator().center([34.3015, -13.2543]).scale(Math.min(width, height) * 10.5).translate([width / 2, height / 2 + 40]);
    const path = d3.geoPath().projection(projection);

    let geoData = null;
    let districtSel = null, lakeSel = null, districtLabels = null, clickLayer = null, zoomBehavior = null;
    let selectedFeature = null, selectedFeatureId = null;
    let currentTransform = d3.zoomIdentity;

    function norm(s) { return (s || '').trim().toUpperCase().replace(/\s+/g, ' '); }
    function toTitleCase(s) { return s.trim().replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()); }
    function featName(feat) { const p = feat.properties || {}; for (const k of ['NAME_1','NAME','DISTRICT','Dist_Name','DISTRICT NAME','DISTNAME','DIST_NAME','district','District','name']) { if (p[k] && typeof p[k] === 'string' && p[k].trim()) return p[k]; } return ''; }
    function distId(d) { const p = d.properties || {}; return p.id || p.NAME_1 || p.DISTRICT || p.name || JSON.stringify(p).slice(0, 40); }
    function districtFill(d) { return DATA.find(x => norm(x.district) === norm(featName(d))) ? '#a8935a' : '#d3d6d9'; }
    function fmt(n) { return Number(n).toLocaleString(); }
    function isLake(f) { const p = f.properties || {}; const t = (p.TYPE || p.type || '').toLowerCase(); const n = (p.NAME || p.NAME_1 || p.name || '').toLowerCase(); return t.includes('lake') || n.includes('lake'); }
    function debounce(func, wait) { let timeout; return function() { const context = this, args = arguments; clearTimeout(timeout); timeout = setTimeout(() => func.apply(context, args), wait); }; }

    async function loadData() {
      try {
        loading.style('display', 'flex');
        const geo = await d3.json('malawi_districts.geojson');
        geoData = geo;
        drawMap();
        renderTotalsPanel();
        loading.style('display', 'none');
      } catch (err) {
        console.error('Failed to load data:', err);
        loading.select('span').text('Error: Ensure malawi_districts.geojson is in the same folder.');
      }
    }

    function drawMap() {
      const features = geoData.features || [];
      const lakes = features.filter(isLake);
      const districts = features.filter(f => !isLake(f));

      lakeSel = mapGroup.append('g').attr('class', 'lakes').selectAll('path').data(lakes).enter().append('path').attr('class', 'lake').attr('d', path);
      districtSel = mapGroup.append('g').attr('class', 'districts').selectAll('path').data(districts).enter().append('path').attr('class', 'district').attr('d', path).attr('fill', d => districtFill(d));

      addClickLayer();
      addDistrictLabels();
      initZoom();
    }

    function addClickLayer() {
      if (!geoData) return;
      d3.selectAll('.click-layer').remove();
      const districts = geoData.features.filter(f => !isLake(f));
      clickLayer = mapGroup.append('g').attr('class', 'click-layer');
      clickLayer.selectAll('path').data(districts).enter().append('path').attr('class', d => norm(featName(d)) === 'LIKOMA' ? 'district-click-target district-click-likoma' : 'district-click-target').attr('d', path).on('click', function(event, d) { event.stopPropagation(); onDistrictClick(d); }).on('touchstart', function(event, d) { event.preventDefault(); onDistrictClick(d); });
    }

    function addDistrictLabels() {
      if (!geoData) return;
      d3.selectAll('.district-labels').remove();
      const districts = geoData.features.filter(f => !isLake(f));
      const labelsGroup = svg.append('g').attr('class', 'district-labels');
      districtLabels = labelsGroup.selectAll('text').data(districts).enter().append('text').attr('class', 'district-label').text(d => { const normName = norm(featName(d)); const hasData = !!DATA.find(x => norm(x.district) === normName); return hasData ? toTitleCase(featName(d)) : (DISTRICT_LABELS[normName] || normName.substring(0, 3)); });
      updateLabelsPosition();
    }

    function updateLabelsPosition() {
      if (!districtLabels) return;
      districtLabels.attr('x', d => { const c = path.centroid(d); const t = currentTransform.apply(c); return t[0]; }).attr('y', d => { const c = path.centroid(d); const t = currentTransform.apply(c); return t[1]; });
    }

    function initZoom() {
      zoomBehavior = d3.zoom().scaleExtent([1, 12]).on('zoom', (event) => { currentTransform = event.transform; mapGroup.attr('transform', event.transform); updateLabelsPosition(); });
      svg.call(zoomBehavior);
    }

    function focusOnFeature(feature) {
      const bounds = path.bounds(feature);
      const dx = bounds[1][0] - bounds[0][0];
      const dy = bounds[1][1] - bounds[0][1];
      const x = (bounds[0][0] + bounds[1][0]) / 2;
      const y = (bounds[0][1] + bounds[1][1]) / 2;
      const scale = Math.max(1, Math.min(30, 0.9 / Math.max(dx / (width * 0.4), dy / (height * 1.4))));
      const translate = [width * 0.5 - scale * x, height * 0.25 - scale * y];
      currentTransform = d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale);
      svg.call(zoomBehavior.transform, currentTransform);
      updateLabelsPosition();
      if (districtLabels) districtLabels.classed('hidden', true);
    }

    function resetView() {
      selectedFeature = null; selectedFeatureId = null;
      currentTransform = d3.zoomIdentity;
      svg.call(zoomBehavior.transform, currentTransform);
      if (districtSel) { districtSel.classed('faded', false).classed('focused', false).attr('fill', d => districtFill(d)); }
      if (districtLabels) districtLabels.classed('hidden', false);
      updateLabelsPosition();
      hideAllPanels();
      header.classed('hidden', false);
      legend.classed('hidden', false);
      escHint.classed('visible', false);
    }

    function onDistrictClick(d) {
      const id = distId(d);
      if (selectedFeature && selectedFeatureId === id) { resetView(); return; }
      selectedFeature = d; selectedFeatureId = id;
      header.classed('hidden', true); legend.classed('hidden', true); escHint.classed('visible', true);
      focusOnFeature(d);
      districtSel.classed('faded', dd => dd !== d).classed('focused', dd => dd === d).filter(dd => dd === d).attr('fill', '#0d2136').raise();
      showPanel(infoPanel);
      renderDistrictPanel(featName(d), DATA.find(x => norm(x.district) === norm(featName(d))));
    }

    function showPanel(panel) { hideAllPanels(); panel.classed('visible', true).attr('aria-hidden', 'false'); }
    function hideAllPanels() { infoPanel.classed('visible', false).attr('aria-hidden', 'true'); totalsPanel.classed('visible', false).attr('aria-hidden', 'true'); searchPanel.classed('visible', false).attr('aria-hidden', 'true'); }

    function renderDistrictPanel(name, data) {
      d3.select('#info-panel-title').text(name || 'District');
      if (!data) {
        d3.select('#info-panel-subtitle').text('No projects recorded');
        d3.select('#info-panel-content').html(`<div style="padding: 24px 18px; text-align: center;"><div style="font-size: 40px; margin-bottom: 10px;">🗺️</div><p style="margin: 0; font-size: 14px; color: #888; line-height: 1.5;"><strong style="display: block; color: var(--navy); font-size: 16px; margin-bottom: 6px;">Area not covered</strong>This district has no active DCAFS projects.</p></div>`);
        return;
      }
      d3.select('#info-panel-subtitle').text('Project breakdown');
      d3.select('#info-panel-content').html(`
        <div class="impact-stat-row">
          <div class="impact-stat-label">Total Projects</div>
          <div class="impact-stat-value">${data.projects}</div>
          <div class="impact-stat-bar-track"><div class="impact-stat-bar bar-navy" style="width:100%"></div></div>
        </div>
        <div class="impact-stat-row">
          <div class="impact-stat-label">Allocated Budget</div>
          <div class="impact-stat-value">${data.budget}</div>
          <div class="impact-stat-sub">${data.names}</div>
        </div>
        <div class="impact-stat-row">
          <div class="impact-stat-label">Value Chains Supported</div>
          <div class="impact-stat-value" style="font-size: 16px;">${data.chains}</div>
        </div>`);
    }

    function renderTotalsPanel() {
      const totalProjects = DATA.reduce((s,d) => s + d.projects, 0);
      const totalBudget = DATA.reduce((s,d) => s + parseFloat(d.budget.replace(/[^0-9.]/g, '')), 0).toFixed(1);
      const totalChains = [...new Set(DATA.flatMap(d => d.chains.split(',')))].length;
      
      d3.select('#totals-panel-content').html(`
        <div class="totals-row"><span class="totals-label"><span class="totals-dot" style="background:var(--navy)"></span>Total Projects</span><span class="totals-value">${totalProjects}</span></div>
        <div class="totals-row"><span class="totals-label"><span class="totals-dot" style="background:var(--purple)"></span>Total Budget</span><span class="totals-value">$${totalBudget}M</span></div>
        <div class="totals-row"><span class="totals-label"><span class="totals-dot" style="background:var(--navy)"></span>Districts Covered</span><span class="totals-value">${DATA.length}</span></div>
        <div class="totals-row"><span class="totals-label"><span class="totals-dot" style="background:var(--purple)"></span>Value Chains</span><span class="totals-value">${totalChains}</span></div>`);
    }

    function setupSearch() {
      districtSearch.on('input', debounce(function() {
        const query = this.value.toLowerCase().trim();
        if (query.length < 2) { searchResults.html(''); return; }
        if (!geoData) return;
        const filtered = geoData.features.filter(f => { if (isLake(f)) return false; return featName(f).toLowerCase().includes(query); });
        let html = '';
        if (filtered.length === 0) {
          html = '<div class="search-result-item" style="color:#999">No districts found</div>';
        } else {
          filtered.forEach(district => { const name = featName(district); html += `<div class="search-result-item" data-name="${name}">${name}</div>`; });
        }
        searchResults.html(html);
        document.querySelectorAll('.search-result-item[data-name]').forEach(item => {
          item.addEventListener('click', function() {
            const name = this.getAttribute('data-name');
            const feature = geoData.features.find(f => norm(featName(f)) === norm(name));
            if (feature) { hideAllPanels(); onDistrictClick(feature); showPanel(infoPanel); }
          });
        });
      }, 300));
    }
    setupSearch();

    d3.select('#totals-button').on('click', () => { hideAllPanels(); header.classed('hidden', true); legend.classed('hidden', true); escHint.classed('visible', true); showPanel(totalsPanel); });
    d3.select('#search-button').on('click', () => { showPanel(searchPanel); districtSearch.node().value = ''; searchResults.html(''); setTimeout(() => districtSearch.node().focus(), 100); });
    d3.select('#reset-button').on('click', () => resetView());
    d3.selectAll('.close-button').on('click', function(event) { event.stopPropagation(); resetView(); });
    svg.on('click', (event) => { if (event.target.tagName && event.target.tagName.toLowerCase() === 'svg') resetView(); });

    window.addEventListener('resize', debounce(() => {
      width = mapRoot.clientWidth; height = mapRoot.clientHeight;
      svg.attr('viewBox', `0 0 ${width} ${height}`);
      projection.scale(Math.min(width, height) * 10.5).translate([width / 2, height / 2 + 40]);
      svg.selectAll('path').attr('d', path);
      d3.selectAll('.click-layer').remove();
      addClickLayer();
      d3.selectAll('.district-labels').remove();
      addDistrictLabels();
    }, 250));

    loadData();
  })();
  </script>
</body>
</html>
